[project]
name = "hydra-qol"
version = "0.2.0"
description = "Quality-of-life helpers for Hydra: register dataclass configs and check that all YAML config files are valid."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thomas M Kehrenberg", email = "tmke8@posteo.net" }]
requires-python = ">=3.11"
dependencies = ["hydra-core>=1.4.0rc1", "omegaconf>=2.4"]
keywords = ["hydra", "config", "configuration", "dataclass", "omegaconf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/tmke8/hydra-qol"
Issues = "https://github.com/tmke8/hydra-qol/issues"

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "docs" }]
test = ["pytest>=8"]
lint = ["ruff>=0.14", "ty"]
docs = ["sphinx>=8", "furo"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
disjoint-cast = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
truthiness-test-of-none-union = "warn"
unsound-assignment = "warn"
unsound-return-statement = "warn"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = [
    "ARG", # flake8-unused-args
    "B",   # bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle
    "F",   # pyflakes
    "FBT", # boolean trap
    "I",   # isort
    "INP", # implicit namespace package
    "N",   # pep8-naming
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLR", # pylint refactor
    "PLW", # pylint warning
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",
]
ignore = [
    "E501",    # line too long (conflicts with formatter)
    "N812",    # case of import alias
    "PLR0402", # useless import alias
    "PLR2004", # magic number comparison
    "PLR0913", # too many arguments
    "PLW2901", # overwriting loop variables
    "PLC0105", # mark variance in typevar name
    "W191",    # tab indentation (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F403",
    "PLC0414", # reexporting
]
"docs/conf.py" = ["INP"]
"tests/**" = ["INP"]

[tool.ruff.lint.isort]
known-third-party = ["hydra"]
extra-standard-library = ["typing_extensions"]
no-lines-before = ["future", "standard-library"]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.pylint]
max-statements = 60 # default: 50
max-branches = 13   # default: 12
